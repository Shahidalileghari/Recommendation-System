[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-ranking-systems"
version = "0.1.0"
description = "Practical recommendation and learning-to-rank engineering baselines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
recsys-lab = "recsys_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
